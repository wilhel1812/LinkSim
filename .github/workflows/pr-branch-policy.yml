name: PR Branch Policy

on:
  pull_request:
    types: [opened, reopened, synchronize, edited]
    branches:
      - staging
  pull_request_target:
    types: [opened, reopened, synchronize, edited]
    branches:
      - main

jobs:
  enforce:
    name: PR Branch Policy / enforce
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Validate head branch naming policy
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ "$BASE_REF" = "staging" ]; then
            if [[ "$HEAD_REF" =~ ^issue/[0-9]+-[a-z0-9-]+$ ]] || [[ "$HEAD_REF" =~ ^hotfix/[a-z0-9-]+$ ]] || [[ "$HEAD_REF" =~ ^chore/[a-z0-9-]+$ ]]; then
              exit 0
            fi
            echo "PR to staging must come from issue/<id>-<slug>, hotfix/<slug>, or chore/<slug>."
            exit 1
          fi
          if [ "$BASE_REF" = "main" ]; then
            if [ "$HEAD_REF" = "staging" ] || [[ "$HEAD_REF" =~ ^release/v[0-9]+\.[0-9]+\.[0-9]+$ ]] || [[ "$HEAD_REF" =~ ^hotfix/[a-z0-9-]+$ ]]; then
              exit 0
            fi
            if [[ "$HEAD_REF" =~ ^docs/[0-9]+-[a-z0-9-]+$ ]]; then
              test "$HEAD_REPO" = "$GITHUB_REPOSITORY"
              exit 0
            fi
            echo "PR to main must come from staging, release/vX.Y.Z, hotfix/<slug>, or same-repository docs/<id>-<slug>."
            exit 1
          fi

      - name: Checkout trusted base policy
        if: github.base_ref == 'main' && startsWith(github.head_ref, 'docs/')
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Require a documentation-only diff with trusted policy
        if: github.base_ref == 'main' && startsWith(github.head_ref, 'docs/')
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git cat-file -e "${HEAD_SHA}^{commit}"
          node scripts/docs-only-policy.mjs require \
            --base "$BASE_SHA" --head "$HEAD_SHA" --mode three-dot

  enforce-staging:
    name: PR Branch Policy / enforce-staging
    if: always() && github.base_ref == 'staging'
    needs: enforce
    runs-on: ubuntu-latest
    permissions: {}
    env:
      BASE_REF: ${{ github.base_ref }}
      ENFORCE_RESULT: ${{ needs.enforce.result }}
    steps:
      - name: Confirm staging branch-policy result
        run: |
          test "$BASE_REF" = "staging"
          test "$ENFORCE_RESULT" = "success"

  enforce-main:
    name: PR Branch Policy / enforce-main
    if: always() && github.base_ref == 'main'
    needs: enforce
    runs-on: ubuntu-latest
    permissions: {}
    env:
      BASE_REF: ${{ github.base_ref }}
      ENFORCE_RESULT: ${{ needs.enforce.result }}
    steps:
      - name: Confirm main branch-policy result
        run: |
          test "$BASE_REF" = "main"
          test "$ENFORCE_RESULT" = "success"
