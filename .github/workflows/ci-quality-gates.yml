name: CI Quality Gates

on:
  pull_request:
    types: [opened, reopened, synchronize, edited]
    branches:
      - main
      - staging
  push:
    branches-ignore:
      - main
      - staging

jobs:
  verify:
    name: CI Quality Gates / verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate named-agent identity and provenance contract
        run: npm run agents:validate

      - name: Secret pattern scan
        run: npm run security:scan

      - name: Run unit and API tests with coverage
        run: npm run test:ci

      - name: Build production bundle
        run: npm run build

      - name: Report status
        run: |
          echo "::notice ::CI Quality Gates passed"

  verify-staging:
    name: CI Quality Gates / verify-staging
    if: always() && github.base_ref == 'staging'
    needs: verify
    runs-on: ubuntu-latest
    permissions: {}
    env:
      BASE_REF: ${{ github.base_ref }}
      VERIFY_RESULT: ${{ needs.verify.result }}
    steps:
      - name: Confirm staging verification result
        run: |
          test "$BASE_REF" = "staging"
          test "$VERIFY_RESULT" = "success"

  verify-main:
    name: CI Quality Gates / verify-main
    if: always() && github.base_ref == 'main'
    needs: verify
    runs-on: ubuntu-latest
    permissions: {}
    env:
      BASE_REF: ${{ github.base_ref }}
      VERIFY_RESULT: ${{ needs.verify.result }}
    steps:
      - name: Confirm main verification result
        run: |
          test "$BASE_REF" = "main"
          test "$VERIFY_RESULT" = "success"
