name: Docs Branch Policy

on:
  pull_request_target:
    types: [opened, reopened, synchronize, edited]
    branches:
      - main

jobs:
  evaluate-main-docs:
    name: Docs Branch Policy / evaluate-main-docs
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      HEAD_REF: ${{ github.event.pull_request.head.ref }}
      HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
      GITHUB_REPOSITORY: ${{ github.repository }}
    steps:
      - name: Accept non-documentation branches
        if: ${{ !startsWith(github.event.pull_request.head.ref, 'docs/') }}
        run: echo "Not a documentation-lane pull request."

      - name: Validate documentation branch identity
        if: ${{ startsWith(github.event.pull_request.head.ref, 'docs/') }}
        run: |
          set -euo pipefail
          [[ "$HEAD_REF" =~ ^docs/[0-9]+-[a-z0-9-]+$ ]]
          test "$HEAD_REPO" = "$GITHUB_REPOSITORY"

      - name: Checkout trusted base policy
        if: ${{ startsWith(github.event.pull_request.head.ref, 'docs/') }}
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Evaluate the complete diff with trusted base policy
        if: ${{ startsWith(github.event.pull_request.head.ref, 'docs/') }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git cat-file -e "${HEAD_SHA}^{commit}"
          node scripts/docs-only-policy.mjs require \
            --base "$BASE_SHA" --head "$HEAD_SHA" --mode three-dot

  publish-main-docs:
    name: Docs Branch Policy / publish-main-docs
    needs: evaluate-main-docs
    if: always()
    runs-on: ubuntu-latest
    permissions: {}
    environment: docs-policy-publisher
    steps:
      - name: Mint documentation policy App token
        id: docs-policy-app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.DOCS_POLICY_APP_CLIENT_ID }}
          private-key: ${{ secrets.DOCS_POLICY_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-checks: write

      - name: Publish documentation branch policy check
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        env:
          EVALUATOR_RESULT: ${{ needs.evaluate-main-docs.result }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        with:
          github-token: ${{ steps.docs-policy-app-token.outputs.token }}
          script: |
            const headSha = process.env.HEAD_SHA;
            if (!/^[0-9a-f]{40}$/.test(headSha ?? "")) {
              throw new Error("Pull-request head SHA must be exactly 40 lowercase hexadecimal characters.");
            }

            const evaluatorResult = process.env.EVALUATOR_RESULT;
            const conclusion = evaluatorResult === "success" ? "success" : "failure";
            await github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: "Docs Branch Policy / enforce-main-docs",
              head_sha: headSha,
              status: "completed",
              conclusion,
              output: {
                title: "Protected-base documentation policy evaluation",
                summary: `evaluate-main-docs completed with result: ${evaluatorResult}`,
              },
            });
