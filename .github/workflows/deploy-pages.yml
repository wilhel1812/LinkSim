name: Deploy LinkSim Pages

on:
  pull_request:
    branches:
      - staging
    types:
      - opened
      - reopened
      - synchronize
  push:
    branches:
      - staging
      - main
  workflow_dispatch:
    inputs:
      target:
        description: "Deployment target"
        required: true
        default: "staging"
        type: choice
        options:
          - staging
          - prod-main

jobs:
  classify_changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
    steps:
      - name: Checkout event commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Classify documentation-only change
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_BEFORE_SHA: ${{ github.event.before }}
          EVENT_HEAD_SHA: ${{ github.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            echo "changed_count=unknown" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$EVENT_NAME" = "pull_request" ]; then
            node scripts/docs-only-policy.mjs classify \
              --base "$PR_BASE_SHA" --head "$PR_HEAD_SHA" --mode three-dot
            exit 0
          fi
          node scripts/docs-only-policy.mjs classify \
            --base "$EVENT_BEFORE_SHA" --head "$EVENT_HEAD_SHA" --mode two-dot

  deploy-staging-preview:
    needs: classify_changes
    if: |
      needs.classify_changes.outputs.docs_only != 'true' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      vars.ENABLE_AUTHENTICATED_PREVIEWS == 'true'
    runs-on: ubuntu-latest
    environment: staging
    concurrency:
      group: pages-preview-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout pull request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Detect shared D1 schema change
        id: identity_schema
        env:
          PREVIEW_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [[ ! "$PREVIEW_BASE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "Invalid preview base SHA." >&2
            exit 1
          fi
          if git diff --quiet "$PREVIEW_BASE_SHA"...HEAD -- db/migrations/2026-08-12_identity_lifecycle.sql db/migrations/2026-08-20_site_notice.sql db/migrations/2026-08-27_basemap_preferences.sql; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Authenticated preview skipped: this PR requires the shared staging D1 migration first." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Setup Node
        if: steps.identity_schema.outputs.changed != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.identity_schema.outputs.changed != 'true'
        run: npm ci

      - name: Verify production Access boundary
        if: steps.identity_schema.outputs.changed != 'true'
        run: node scripts/access-boundary.mjs check production

      - name: Build preview
        if: steps.identity_schema.outputs.changed != 'true'
        env:
          VITE_MAPTILER_KEY: ${{ secrets.VITE_MAPTILER_KEY }}
          VITE_CARTO_KEY: ${{ secrets.VITE_CARTO_KEY }}
        run: npm run build:bundle && npm run build:verify

      - name: Deploy authenticated staging preview
        if: steps.identity_schema.outputs.changed != 'true'
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          VITE_MAPTILER_KEY: ${{ secrets.VITE_MAPTILER_KEY }}
          VITE_CARTO_KEY: ${{ secrets.VITE_CARTO_KEY }}
          PREVIEW_BRANCH: ${{ github.head_ref }}
        run: node scripts/deploy-pages-safe.mjs --target staging-preview --branch "$PREVIEW_BRANCH"

      - name: Verify immutable preview Access boundary
        if: steps.identity_schema.outputs.changed != 'true'
        env:
          ACCESS_PREVIEW_URL: ${{ steps.deploy.outputs.preview_url }}
        run: node scripts/access-boundary.mjs check-preview staging

      - name: Update pull request preview comment
        if: steps.identity_schema.outputs.changed != 'true'
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.preview_url }}
        with:
          script: |
            const { execFileSync } = require('node:child_process');
            const marker = '<!-- linksim-preview:v1 -->';
            const sha = context.payload.pull_request.head.sha;
            const runId = require('node:crypto').randomUUID();
            const footer = JSON.parse(execFileSync(process.execPath, [
              'scripts/ai-provenance.mjs',
              'footer',
              '--agent', 'Beacon',
              '--run', runId,
              '--source', `pull-request-${context.issue.number}`,
              '--commit', sha,
            ], { encoding: 'utf8' }));
            const body = [
              marker,
              'Authenticated staging preview:',
              '',
              `[Open preview](${process.env.PREVIEW_URL})`,
              '',
              `Commit: \`${sha}\``,
              '',
              footer.signature,
              '',
              footer.marker,
            ].join('\n');
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find((comment) =>
              comment.user?.type === 'Bot' && comment.body?.includes(marker)
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  deploy-staging:
    needs: classify_changes
    if: |
      needs.classify_changes.outputs.docs_only != 'true' &&
      (
        (github.event_name == 'push' && github.ref == 'refs/heads/staging') ||
        (github.event_name == 'workflow_dispatch' && github.event.inputs.target == 'staging')
      )
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: staging
          fetch-depth: 0

      - name: Fetch production version baseline
        run: git fetch --no-tags origin main:refs/remotes/origin/main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply staging Simulation lifecycle migration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if ! npx wrangler d1 execute linksim_staging --remote --command "SELECT status FROM simulations LIMIT 0;"; then
            npx wrangler d1 execute linksim_staging --remote --file db/migrations/2026-08-04_simulation_soft_delete.sql --yes
          fi
          npx wrangler d1 execute linksim_staging --remote --command "PRAGMA table_info(simulations);"

      - name: Verify identity lifecycle migration prerequisites and apply migration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if ! npx wrangler d1 execute linksim_staging --remote --command "SELECT version FROM identity_lifecycle_meta WHERE singleton = 1;"; then
            node scripts/verify-identity-lifecycle-d1.mjs linksim_staging pre
            npx wrangler d1 execute linksim_staging --remote --file db/migrations/2026-08-12_identity_lifecycle.sql --yes
          fi
          node scripts/verify-identity-lifecycle-d1.mjs linksim_staging post

      - name: Apply staging Site notice migration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler d1 execute linksim_staging --remote --file db/migrations/2026-08-20_site_notice.sql --yes
          npx wrangler d1 execute linksim_staging --remote --command "SELECT revision FROM site_notice WHERE singleton = 1;"

      - name: Apply staging basemap preferences migration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if ! npx wrangler d1 execute linksim_staging --remote --command "SELECT basemap_preferences_json FROM users LIMIT 0;"; then
            npx wrangler d1 execute linksim_staging --remote --file db/migrations/2026-08-27_basemap_preferences.sql --yes
          fi
          npx wrangler d1 execute linksim_staging --remote --command "SELECT basemap_preferences_json FROM users LIMIT 0;"

      - name: Deploy staging with guardrails
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          VITE_MAPTILER_KEY: ${{ secrets.VITE_MAPTILER_KEY }}
          VITE_CARTO_KEY: ${{ secrets.VITE_CARTO_KEY }}
        run: npm run deploy:staging

      - name: Verify staging Access boundary
        run: node scripts/access-boundary.mjs check staging

  deploy-prod-main:
    needs: classify_changes
    if: |
      needs.classify_changes.outputs.docs_only != 'true' &&
      (
        (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
        (github.event_name == 'workflow_dispatch' && github.event.inputs.target == 'prod-main')
      )
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Resolve release tag
        id: release_tag
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Validate production promotion tree
        run: node scripts/validate-prod-promotion.mjs

      - name: Prepare release worktree
        env:
          RELEASE_TAG: ${{ steps.release_tag.outputs.tag }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Invalid resolved release tag." >&2
            exit 1
          fi
          git worktree add --detach "$RUNNER_TEMP/linksim-release" "$RELEASE_TAG"

      - name: Install dependencies
        working-directory: ${{ runner.temp }}/linksim-release
        run: npm ci

      - name: Validate release gate
        working-directory: ${{ runner.temp }}/linksim-release
        env:
          PRODUCTION_PREVIOUS_REF: ${{ github.event.before }}
        run: node scripts/validate-prod-release.mjs

      - name: Verify production Access boundary
        working-directory: ${{ runner.temp }}/linksim-release
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/access-boundary.mjs check production

      - name: Validate production workflow commit
        working-directory: ${{ runner.temp }}/linksim-release
        env:
          DEPLOY_VERIFY_COMMIT: ${{ github.sha }}
        run: node "$GITHUB_WORKSPACE/scripts/deploy-pages-safe.mjs" --target prod-main --verify-commit-only

      - name: Apply production Simulation lifecycle migration
        working-directory: ${{ runner.temp }}/linksim-release
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if ! npx wrangler d1 execute linksim --remote --command "SELECT status FROM simulations LIMIT 0;"; then
            npx wrangler d1 execute linksim --remote --file db/migrations/2026-08-04_simulation_soft_delete.sql --yes
          fi
          npx wrangler d1 execute linksim --remote --command "SELECT status FROM simulations LIMIT 0;"

      - name: Verify identity lifecycle migration prerequisites and apply migration
        working-directory: ${{ runner.temp }}/linksim-release
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if ! npx wrangler d1 execute linksim --remote --command "SELECT version FROM identity_lifecycle_meta WHERE singleton = 1;"; then
            node scripts/verify-identity-lifecycle-d1.mjs linksim pre
            npx wrangler d1 execute linksim --remote --file db/migrations/2026-08-12_identity_lifecycle.sql --yes
          fi
          node scripts/verify-identity-lifecycle-d1.mjs linksim post

      - name: Apply production Site notice migration
        working-directory: ${{ runner.temp }}/linksim-release
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler d1 execute linksim --remote --file db/migrations/2026-08-20_site_notice.sql --yes
          npx wrangler d1 execute linksim --remote --command "SELECT revision FROM site_notice WHERE singleton = 1;"

      - name: Apply production basemap preferences migration
        working-directory: ${{ runner.temp }}/linksim-release
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if ! npx wrangler d1 execute linksim --remote --command "SELECT basemap_preferences_json FROM users LIMIT 0;"; then
            npx wrangler d1 execute linksim --remote --file db/migrations/2026-08-27_basemap_preferences.sql --yes
          fi
          npx wrangler d1 execute linksim --remote --command "SELECT basemap_preferences_json FROM users LIMIT 0;"

      - name: Deploy prod/main with guardrails
        working-directory: ${{ runner.temp }}/linksim-release
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          VITE_MAPTILER_KEY: ${{ secrets.VITE_MAPTILER_KEY }}
          VITE_CARTO_KEY: ${{ secrets.VITE_CARTO_KEY }}
          DEPLOY_VERIFY_COMMIT: ${{ github.sha }}
        run: npm run build:bundle && npm run build:verify && node "$GITHUB_WORKSPACE/scripts/deploy-pages-safe.mjs" --target prod-main
